[project]
name = "trustlink"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abijith R A", email = "Abijithra2004@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.165.0",
    "pandas>=3.1.1",
    "pathlib>=1.0.1",
